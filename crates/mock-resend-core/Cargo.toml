[package]
name = "mock-resend-core"
description = "The mock-resend engine: mailbox, delivery events, scheduling and storage. Knows nothing about HTTP or JSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
# For the `whsec_` signing secret only. A real Svix verifier base64-decodes the part
# after the prefix, so the encoding is part of Resend's data model rather than anything
# to do with HTTP or JSON.
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
thiserror.workspace = true
# `sync` only, for the channel transitions are announced on. No sockets here.
tokio = { workspace = true, default-features = false, features = ["sync"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true }

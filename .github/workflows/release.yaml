name: Release

# Publishes the container image when a version tag is pushed.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Nothing here runs on an ordinary push: `latest` has to mean the newest release, not
# the newest commit, or anyone who wrote `image: rapturedotsh/mock-resend` in a compose
# file is running whatever landed on main an hour ago.
#
# Each architecture builds on a machine of that architecture. The alternative is QEMU,
# which emulates an ARM CPU to run rustc — for a release build with fat LTO that turns a
# few minutes into the better part of an hour.
#
# The blacksmith-* label needs the Blacksmith GitHub App installed on the repository. A
# fork without it sees that job queue forever rather than fail, which is a confusing way
# to find out: swap it for `ubuntu-latest`, which is free for public repositories and
# works the same way.

on:
  push:
    tags: ["v*"]

# The tag is the input, so two pushes of the same tag must not race each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: rapturedotsh/mock-resend

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            # Two vCPU because larger Blacksmith sizes are accepted and then queue
            # without ever being picked up on the current plan. Raise it if that changes.
            runner: blacksmith-2vcpu-ubuntu-2404
          - platform: linux/arm64
            # GitHub's own ARM runner, not Blacksmith. The blacksmith-*-arm labels are
            # not served on this account's plan: a job asking for one is accepted and
            # then queues forever rather than failing, which is a slow way to find out.
            # This one is native ARM and free for public repositories.
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Each build pushes a nameless image identified only by its digest. The tags are
      # attached once, in the publish job, to the index that covers both architectures —
      # so there is never a moment where `latest` means one architecture.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # No cache, deliberately. A shared cache is a way for a poisoned entry to put
          # content into a published image, and the native build is a couple of minutes
          # anyway — the wrong trade to make on the one artifact people actually run.
          no-cache: true

      # Run the image before anything is tagged. The publish job needs this one, so a
      # broken build cannot become `latest` and be found by whoever pulls next.
      - name: Smoke-test the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          docker run -d --name smoke -p 9100:9100 -p 1025:1025 \
            "${DOCKERHUB_IMAGE}@${DIGEST}"

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9100/_admin/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            docker logs smoke
            exit 1
          fi

          curl -fsS http://localhost:9100/_admin/health | grep -q '"status":"ok"'

          # A round trip, not just liveness: the thing this image exists to do. Capture
          # a message through the Resend API and read it back by the id it handed out.
          id=$(curl -fsS -X POST http://localhost:9100/emails \
            -H "Authorization: Bearer re_smoke_test" \
            -H "Content-Type: application/json" \
            -d '{"from":"a@example.com","to":"b@example.org","subject":"smoke","text":"it works"}' \
            | sed -E 's/.*"id":"([^"]+)".*/\1/')

          curl -fsS "http://localhost:9100/emails/${id}" \
            -H "Authorization: Bearer re_smoke_test" | grep -q '"subject":"smoke"'

          # The other way in, which is a second listener and a second parser.
          python3 - <<'PY'
          import smtplib
          from email.message import EmailMessage

          message = EmailMessage()
          message["From"] = "a@example.com"
          message["To"] = "b@example.org"
          message["Subject"] = "smtp smoke"
          message.set_content("it works")

          with smtplib.SMTP("localhost", 1025, timeout=10) as smtp:
              smtp.login("resend", "re_smoke_test")
              smtp.send_message(message)
          PY

          curl -fsS "http://localhost:9100/_admin/mailbox?api_key=re_smoke_test" \
            | grep -q '"subject":"smtp smoke"'

          # The console is embedded, so a missing web/dist shows up here too.
          curl -fsS http://localhost:9100/_admin/console/ | grep -q "<title>mock-resend</title>"

          docker rm -f smoke

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish
    # Stitching a manifest is a few API calls, so this one stays on GitHub's free runner.
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 becomes 1.2.3, 1.2, 1 and latest, all pointing at one index. Someone can
      # pin exactly, follow patches, follow minors, or just take the newest.
      #
      # `latest` is not listed: the action's default `flavor: latest=auto` adds it for a
      # release tag and withholds it for a prerelease, which is what we want. Listing it
      # as well produced it twice.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create the multi-architecture index
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${DOCKERHUB_IMAGE}@sha256:%s " *)

      - name: Check both architectures are in the index
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:latest" | tee /tmp/index.txt
          grep -q "linux/amd64" /tmp/index.txt
          grep -q "linux/arm64" /tmp/index.txt

      # Docker Hub shows its own README on the image page, separate from the one on
      # GitHub. Without this step it is blank, which is the first thing anyone sees.
      #
      # It syncs `DOCKERHUB.md`, not `README.md`. Someone arriving from a registry search
      # wants to run the image, not read about the crate layout or how to contribute, and
      # relative links in the repository README resolve to nothing on Docker Hub.
      #
      # Not allowed to fail the release. By the time it runs the image is already pushed
      # and the index already stitched, so failing here marks a release that shipped as a
      # failure and tells nobody anything useful. It needs a Docker Hub access token with
      # `read/write/delete` scope: a narrower one pushes images happily and then returns
      # `Forbidden` on this one call.
      - name: Update the Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "Resend-compatible email API for local dev and CI. Captures mail, fires signed webhooks."
          readme-filepath: ./DOCKERHUB.md

  release:
    name: Draft the release
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # A draft on purpose: the notes are written by a person, and publishing is the
      # last deliberate step. The image is already out by this point, which is the right
      # order — the release notes point at something that exists.
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true

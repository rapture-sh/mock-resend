name: Release

on:
  push:
    tags: ["v*"]

# The tag is the input, so two pushes of the same tag must not race each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: publish the container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:latest` follows the most recent tag rather than the tip of main: someone's CI
      # pins it and expects it to keep working.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rapture-sh/mock-resend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: draft the release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A draft on purpose: the notes are written by a person, and publishing is the
      # last deliberate step.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

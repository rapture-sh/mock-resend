name: CI

# Deliberately small. CI covers the checks that catch a real break and nothing else:
# format, lint, the test suite, whether the console still compiles, and whether the
# image still builds and runs.
#
# That last one is here because of `.github/rulesets/tags.json`: a pushed tag cannot be
# deleted or force-moved, so a release that falls over on a broken Dockerfile burns the
# version number — you cannot retag v0.1.0, you ship v0.1.1 instead. Two minutes on a
# pull request is cheaper than that. The release workflow still smoke-tests both
# architectures before anything is tagged; this is the earlier, cheaper copy of the same
# question.
#
# If CI starts feeling slow, delete a job rather than adding a cache.
#
# The job names here are the contexts `.github/rulesets/main.json` requires, so renaming
# one silently stops it gating the branch. Rename it in both places or not at all.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    # Blacksmith, because this is the job worth paying to shorten. The label needs the
    # Blacksmith GitHub App installed on the repository; a fork without it sees the job
    # queue forever rather than fail, which is a confusing way to find out. Swap it for
    # `ubuntu-latest`, which is free for public repositories and works the same way.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version, so rustup installs it from the checkout and
      # this needs no version here.
      - name: Install the pinned toolchain
        run: rustup show

      # Without this, every run recompiles the whole dependency tree.
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets --all-features -- -D warnings

      # Unit and conformance tests both. The conformance suite drives a real `resend-rs`
      # client against an in-process instance, so it needs no services.
      - run: cargo test --workspace

  console:
    name: Console
    # A pnpm build does not need four cores.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      # The version comes from `packageManager` in web/package.json, so corepack uses the
      # exact pnpm that wrote the lockfile.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - run: pnpm lint
        working-directory: web

      - run: pnpm typecheck
        working-directory: web

      - run: pnpm build
        working-directory: web

  image:
    name: Image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: useblacksmith/setup-docker-builder@v1

      # One architecture only. The release workflow builds both natively; this is
      # asking whether the Dockerfile still works at all, which amd64 answers.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mock-resend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same questions the release smoke test asks, minus the SMTP round trip:
      # does it come up, does it capture a message, and is the console in there.
      - name: Start it and ask whether it works
        run: |
          set -euo pipefail

          docker run -d --name ci -p 9100:9100 mock-resend:ci

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9100/_admin/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            docker logs ci
            exit 1
          fi

          id=$(curl -fsS -X POST http://localhost:9100/emails \
            -H "Authorization: Bearer re_ci" \
            -H "Content-Type: application/json" \
            -d '{"from":"a@example.com","to":"b@example.org","subject":"ci","text":"it works"}' \
            | sed -E 's/.*"id":"([^"]+)".*/\1/')

          curl -fsS "http://localhost:9100/emails/${id}" \
            -H "Authorization: Bearer re_ci" | grep -q '"subject":"ci"'

          curl -fsS http://localhost:9100/_admin/console/ | grep -q "<title>mock-resend</title>"

          docker rm -f ci

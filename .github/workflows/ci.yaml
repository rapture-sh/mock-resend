name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request that is pushed to twice does not need two full runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain comes from rust-toolchain.toml, so there is nothing to pin here.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # The same three commands AGENTS.md asks for before calling work done. Each one
      # runs even if an earlier one failed, so a single push reports every problem
      # rather than only the first.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace

  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: a pull request proves the image still builds without
      # publishing anything.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mock-resend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and ask whether it is well
        run: |
          docker run -d --name mock-resend -p 9100:9100 -p 1025:1025 mock-resend:ci
          for attempt in $(seq 1 30); do
            if docker exec mock-resend /usr/local/bin/mock-resend --healthcheck; then
              exit 0
            fi
            sleep 1
          done
          echo "the container never became healthy"
          docker logs mock-resend
          exit 1

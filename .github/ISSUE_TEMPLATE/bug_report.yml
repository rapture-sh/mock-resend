name: Bug report
description: mock-resend is broken, or behaves differently from real Resend
labels: ["bug"]
body:
  - type: input
    id: endpoint
    attributes:
      label: Which endpoint or surface
      placeholder: POST /emails/batch
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you called, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: real-resend
    attributes:
      label: What real Resend does
      description: >
        If this is a compatibility difference rather than a crash, say what
        Resend returns instead. A doc link or a real observed response is ideal —
        it is what makes the fix verifiable.

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        The smallest payload or sequence of requests that triggers it. Include
        the response body if there is one, and the error `name` if you got one.
        Redact anything you would not want in a public issue.
      render: text
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: "resend 4.0.1 (node), or resend-rs 0.36.1, or curl"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mock-resend version
      description: Image tag, or the commit you built from.
      placeholder: ghcr.io/rapture-sh/mock-resend:latest
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: How are you running it
      options:
        - Docker
        - Built from source
        - mock-resend-testkit, in-process
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which way in
      options:
        - HTTP API
        - SMTP
        - Admin API
        - Webhook delivery
    validations:
      required: true

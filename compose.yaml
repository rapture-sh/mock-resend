# A mock-resend alongside whatever you are testing. Point your app at
# http://email:9100 on this network, or http://localhost:9100 from the host.
services:
  email:
    image: ghcr.io/rapture-sh/mock-resend:latest
    ports:
      - "9100:9100"
      - "1025:1025"
    volumes:
      # Captured mail survives a restart, and the `.eml` files can be opened from the
      # host. Drop this to keep nothing.
      - mock-resend-data:/data
    environment:
      # Off by default; uncomment to prove your backoff works.
      # MOCK_RESEND_RATE_LIMIT: "10"
      #
      # Off by default; set it to walk messages through the delivery lifecycle without
      # driving each step.
      # MOCK_RESEND_DELIVERY_DELAY: "500"
      MOCK_RESEND_LOG: info
    healthcheck:
      test: ["CMD", "/usr/local/bin/mock-resend", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s

volumes:
  mock-resend-data:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .mark { fill: #16161a; }
    .glyph { fill: #fbfbfd; }
    .cut { stroke: #16161a; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #f2f2f5; }
      .glyph { fill: #121216; }
      .cut { stroke: #f2f2f5; }
    }
  </style>
  <rect class="mark" width="32" height="32" rx="7" />
  <!-- An envelope: the one thing this captures, and never delivers. Solid rather than
       outlined because a tab favicon is 16px, where a 2px outline turns to mush. -->
  <rect class="glyph" x="7" y="10" width="18" height="12" rx="2.5" />
  <path class="cut" d="M8.6 12.2 16 17.6 23.4 12.2" fill="none" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>

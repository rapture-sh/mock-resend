<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- White either way, so no `prefers-color-scheme` here: a fixed white tile reads on
       a light tab bar and a dark one, and inverting it would stop it being white. -->
  <rect width="32" height="32" rx="7" fill="#ffffff" />

  <!-- Lucide's `mail`, unchanged, translated to centre its 20x16 body in the 32x32
       tile. Not scaled: at 16px a favicon renders this stroke as one crisp pixel, and
       scaling it up would land the strokes between pixels instead. -->
  <g transform="translate(4 4)" fill="none" stroke="#16161a" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
    <rect x="2" y="4" width="20" height="16" rx="2" />
  </g>
</svg>
